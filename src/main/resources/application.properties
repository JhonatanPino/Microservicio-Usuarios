spring.application.name=Microservicio-Usuarios

server.port=8091
spring.datasource.url=jdbc:mysql://localhost:3306/microservicio_usuarios?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.security.user.name=admin
spring.security.user.password=admin123
spring.main.allow-bean-definition-overriding=true
security.jwt.secret=1234567890abcdef1234567890abcdef
security.jwt.expirationMillis=3600000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true